<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wikidata Timetrail</title>

  <!-- StoryMapJS CSS + JS -->
  <link rel="stylesheet" href="https://cdn.knightlab.com/libs/storymapjs/latest/css/storymap.css">
  <script src="https://cdn.knightlab.com/libs/storymapjs/latest/js/storymap-min.js"></script>

  <style>
    body { 
      margin: 0; 
      padding: 0; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #storymap { 
      width: 100%; 
      height: 800px; 
      flex: 1;
    } /* Required height */
    
    footer {
      position: sticky;
      bottom: 0;
      z-index: 100;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes l1 {to{transform: rotate(.5turn)}}
    
    .loading {
      background-color: #4a9bd1 !important;
    }
    
    .spinning {
      animation: spin 1s linear infinite;
    }
    
    .loading #buttonText {
      display: none;
    }
    
    .loading #loadingSpinner {
      display: inline !important;
    }
    
    .loading #propertyLoadingSpinner {
      display: inline !important;
    }
    
    #propertyLoadingSpinner {
      font-size: 16px;
      color: #007cba;
      margin-right: 4px;
    }
    
    /* #mapLoadingSpinner {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      color: #007cba;
      z-index: 1000;
    } */

    #mapLoadingSpinner {
        display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50px;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 8px solid;
      border-color: #000 #0000;
      animation: l1 1s infinite;
    }
    
    
    #storymap {
      position: relative;
    }
  </style>
</head>
<body>
  <div style="padding:12px 16px;border-bottom:1px solid #e5e5e5;background:#fafafa;font-family:system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
    <form id="filterForm" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label for="itemId" style="font-size:14px;color:#333;">Item ID</label>
        <input id="itemId" name="itemId" type="text" value="" placeholder="e.g. dissolution of the Soviet Union" 
               style="padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:14px;width:140px;">
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label for="propertyId" style="font-size:14px;color:#333;">Property</label>
        <div style="display:flex;align-items:center;gap:8px;">
          <span id="propertyLoadingSpinner" style="display:none;">⟳</span>
          <select id="propertyId" name="propertyId" 
                  style="padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:14px;width:140px;">
            <option value="">Select property...</option>
          </select>     
        </div>
      </div>
      <button type="submit" id="loadButton"
              style="background:#007cba;color:white;padding:10px 16px;border:none;border-radius:6px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;">
        <span id="buttonText">Fetch Timetrail!</span>
        <span id="loadingSpinner" style="display:none;">Fetch Timetrail!</span>
      </button>
      </form>
  </div>

  <div id="storymap">
    <div id="mapLoadingSpinner"></div>
  </div>

  <footer style="padding: 16px; text-align: center; background: #f8f9fa; border-top: 1px solid #e5e5e5; font-size: 12px; color: #666;">
    Made with ❤️ by <a href="https://meta.wikimedia.org/wiki/User:Khajitdadddy" target="_blank">Khajitdadddy</a>
  </footer>

  <script>
    const filterApiBase = 'https://wikidata-timetrail.vercel.app/collection/multiple-values';
    const nameApiBase = 'https://wikidata-timetrail.vercel.app/wikidata/itemName/';
    const propertiesApiBase = 'https://wikidata-timetrail.vercel.app/collection/multiple-props';

    // URL query parameter utilities
    function getQueryParams() {
      const urlParams = new URLSearchParams(window.location.search);
      return {
        item: urlParams.get('item') || '',
        property: urlParams.get('property') || ''
      };
    }

    function updateURL(item, property) {
      const url = new URL(window.location);
      if (item) {
        url.searchParams.set('item', item);
      } else {
        url.searchParams.delete('item');
      }
      if (property) {
        url.searchParams.set('property', property);
      } else {
        url.searchParams.delete('property');
      }
      window.history.replaceState({}, '', url);
    }

    function renderPlaceholder(message) {
      const container = document.getElementById('storymap');
      setMapLoadingState(false); // Hide map loading spinner when showing placeholder
      container.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#555;font-family:system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
          <div style="text-align:center;max-width:680px;padding:24px;color:#444;">
            <h3 style="margin:0 0 8px 0;font-weight:600;color:#222;">Wikidata TimeTrail — Visualize the history of any Wikidata item with StoryMapJS!</h3>
            <p style="margin:0 0 8px 0;">${message}</p>
          </div>
        </div>
      `;
    }

    async function fetchNameForId(id) {
      if (!id) return '';
      console.log('Fetching name for ID:', id);
      try {
        const url = nameApiBase + encodeURIComponent(id);
        console.log('Fetching from URL:', url);
        const res = await fetch(url);
        console.log('Response status:', res.status);
        if (!res.ok) {
          console.log('Response not ok:', res.status, res.statusText);
          return '';
        }
        const text = await res.text();
        console.log('Response text:', text);
        try {
          const data = JSON.parse(text);
          if (typeof data === 'string') return data;
          if (data && typeof data.name === 'string') return data.name;
        } catch (jsonError) {
          // If JSON parsing fails, treat as plain text
          console.log('Not JSON, treating as plain text:', text);
          return text;
        }
        return '';
      } catch (error) {
        console.log('Error fetching name:', error);
        return '';
      }
    }

    async function fetchPropertiesForItem(itemId) {
      const propertyLoadingSpinner = document.getElementById('propertyLoadingSpinner');
      const propertySelect = document.getElementById('propertyId');
      const propertyLabel = document.querySelector('label[for="propertyId"]');
      
      if (!itemId) {
        propertySelect.innerHTML = '<option value="">Select property...</option>';
        propertyLoadingSpinner.style.display = 'none';
        propertyLabel.textContent = 'Property';
        return;
      }
      
      // Show loading state
      propertyLoadingSpinner.style.display = 'inline';
      propertyLoadingSpinner.classList.add('spinning');
      propertySelect.disabled = true;
      propertyLabel.textContent = 'Fetching Properties....';

      console.log('Fetching properties for item:', itemId);
      try {
        const url = `${propertiesApiBase}?item=${encodeURIComponent(itemId)}`;
        console.log('Fetching properties from URL:', url);
        const res = await fetch(url);
        console.log('Properties response status:', res.status);
        
        if (!res.ok) {
          console.log('Properties response not ok:', res.status, res.statusText);
          return;
        }
        
        const properties = await res.json();
        console.log('Fetched properties:', properties);
        
        // Populate dropdown
        propertySelect.innerHTML = '<option value="">Select property...</option>';
        
        if (Array.isArray(properties)) {
          properties.forEach(property => {
            const option = document.createElement('option');
            option.value = property;
            option.textContent = property;
            propertySelect.appendChild(option);
          });
        }
        
        // Set pending property if it exists
        if (window.pendingProperty) {
          propertySelect.value = window.pendingProperty;
          window.pendingProperty = null;
        }
        
      } catch (error) {
        console.log('Error fetching properties:', error);
      } finally {
        // Hide loading spinner and re-enable dropdown
        propertyLoadingSpinner.style.display = 'none';
        propertyLoadingSpinner.classList.remove('spinning');
        propertySelect.disabled = false;
        propertyLabel.textContent = 'Property';
      }
    }

    async function canEmbedUrl(url) {
      try {
        const testIframe = document.createElement('iframe');
        testIframe.style.display = 'none';
        testIframe.src = url;
        
        return new Promise((resolve) => {
          const timeout = setTimeout(() => {
            document.body.removeChild(testIframe);
            resolve(false); // Timeout - likely blocked
          }, 3000);
          
          testIframe.onload = () => {
            clearTimeout(timeout);
            document.body.removeChild(testIframe);
            resolve(true);
          };
          
          testIframe.onerror = () => {
            clearTimeout(timeout);
            document.body.removeChild(testIframe);
            resolve(false);
          };
          
          document.body.appendChild(testIframe);
        });
      } catch (error) {
        console.warn(`Error checking embeddability for ${url}:`, error);
        return false;
      }
    }

    async function createSlidesFromItems(items, selectedItemId, selectedPropertyId, selectedItemName, selectedPropertyName) {
      const slides = await Promise.all(
        items
        .filter(item => {
          if (!item.location) return false;
          const lat = parseFloat(item.location.latitude);
          const lon = parseFloat(item.location.longitude);
          return !isNaN(lat) && !isNaN(lon) && lat !== 0 && lon !== 0;
        }) 
        .map(async (item) => {
          let media = null;
          
          if (item.image) {
            media = {
              url: item.image.original_url,
              caption: item.image.filename,
              credit: `Source: <a href="${item.image.commons_url}" target="_blank">Wikimedia Commons</a>`
            };
          } else if (item.identifier) {
            const canEmbed = await canEmbedUrl(item.identifier);
            if (canEmbed) {
              media = {
                url: item.identifier,
                caption: "External Content",
                credit: `Source: <a href="${item.identifier}" target="_blank">View External Content</a>`
              };
            } else {
              console.warn(`Cannot embed ${item.identifier} - using fallback`);
              media = {
                url: `data:text/html,<div style="padding:20px;text-align:center;"><h3>External Content</h3><p>This content cannot be embedded.</p><a href="${item.identifier}" target="_blank" style="background:#007cba;color:white;padding:10px 20px;text-decoration:none;border-radius:5px;">View External Content</a></div>`,
                caption: "External Content (Click to view)",
                credit: `Source: <a href="${item.identifier}" target="_blank">View External Content</a>`
              };
            }
          }

          return {
            text: {
              headline: item.name,
              text: `
                ${item.desc || ''} 
                <br><strong>Location:</strong> ${item.location.locationName || ''} 
                ${item.id ? `<br><a href="https://www.wikidata.org/wiki/${item.id}" target="_blank">View on Wikidata</a>` : ''}
              `
            },
            location: {
              name: item.location.locationName || '',
              lat: parseFloat(item.location.latitude) || 0,
              lon: parseFloat(item.location.longitude) || 0,
              zoom: 6
            },
            media: media
          };
        })
      );

      // Optional overview slide
      slides.unshift({
        type: "overview",
        text: {
          headline: "Wikidata TimeTrail — Visualize the history of any Wikidata item with StoryMapJS!",
          text: `Enter an Item ID and Property ID to trace your own timeline. Click the arrow and see where the data leads! Current selection shows:  ${(selectedItemId || selectedPropertyId) ? `<br><br><strong>Current selection:</strong> ${selectedItemId ? `Item <code>${selectedItemId}</code> with name ${selectedItemName ? ` (${selectedItemName})` : ''}` : ''}${(selectedItemId && selectedPropertyId) ? ' · ' : ''}${selectedPropertyId ? `Property <code>${selectedPropertyId}</code>${selectedPropertyName ? ` (${selectedPropertyName})` : ''}` : ''}` : ''}`
        },
        // location: {
        //   lat: 11,
        //   lon: 39,
        //   zoom: 8  // zooms closer in
        // }
      });

      return slides;
    }

    function setLoadingState(loading) {
      const button = document.getElementById('loadButton');
      const buttonText = document.getElementById('buttonText');
      const loadingSpinner = document.getElementById('loadingSpinner');
      
      if (loading) {
        button.classList.add('loading');
        button.disabled = true;
        button.style.cursor = 'not-allowed';
        button.style.opacity = '0.7';
      } else {
        button.classList.remove('loading');
        button.disabled = false;
        button.style.cursor = 'pointer';
        button.style.opacity = '1';
      }
    }

    function setMapLoadingState(loading) {
      const mapLoadingSpinner = document.getElementById('mapLoadingSpinner');
      if (!mapLoadingSpinner) return; // Exit if element doesn't exist
      
      if (loading) {
        mapLoadingSpinner.style.display = 'block';
      } else {
        mapLoadingSpinner.style.display = 'none';
      }
    }

    async function initStoryMap(useQueryParams = false) {
      // Validate inputs first; if missing, render helpful placeholder and bail
      let itemId, propertyId;
      
      if (useQueryParams) {
        const params = getQueryParams();
        itemId = params.item || '';
        propertyId = params.property || '';
      } else {
        itemId = (document.getElementById('itemId')).value || '';
        propertyId = (document.getElementById('propertyId')).value || '';
      }
      
      if (!itemId || !propertyId) {
        renderPlaceholder('Enter an Item ID and select a Property to fetch a timetrail.');
        return;
      }

      setLoadingState(true);
      setMapLoadingState(true);
      try {
        // Resolve friendly names in parallel
        const [itemName, propertyName] = await Promise.all([
          fetchNameForId(itemId),
          fetchNameForId(propertyId)
        ]);
        const url = `${filterApiBase}?item=${encodeURIComponent(itemId)}&property=${encodeURIComponent(propertyId)}`;
        const response = await fetch(url);
        if (!response.ok) {
          renderPlaceholder('We could not fetch data for this selection. Please try again.');
          return;
        }
        const items = await response.json();
        if (!Array.isArray(items) || items.length === 0) {
          renderPlaceholder('No results for this selection. Try a different property.');
          return;
        }

        const slides = await createSlidesFromItems(items, itemId, propertyId, itemName, propertyName);
        console.log('Generated slides:', slides);
        if (!slides || slides.length <= 1) { // only overview slide or nothing mappable
          renderPlaceholder('No mappable items with location data for this selection.');
          return;
        }

        // Full StoryMapJS JSON
        const storymapData = {
          width: 1200,
          height: 800,
          storymap: {
            language: "en",
            map_type: "osm:standard",
            slides: slides
          },

        };

        const container = document.getElementById('storymap');
        container.innerHTML = '<div id="mapLoadingSpinner"></div>';
        const storymap = new KLStoryMap.StoryMap('storymap', storymapData, {});
        window.onresize = () => storymap.updateDisplay();

      } catch (error) {
        console.error('Error loading StoryMap:', error);
        renderPlaceholder('Could not load the map right now. Please try again.');
      } finally {
        setLoadingState(false);
        setMapLoadingState(false);
      }
    }
    

    // Initialize form with query parameters
    async function initializeForm() {
      const params = getQueryParams();
      const itemInput = document.getElementById('itemId');
      const propertySelect = document.getElementById('propertyId');
      
      if (params.item) {
        itemInput.value = params.item;
      }
      
      if (params.property) {
        window.pendingProperty = params.property;
      }
        if (params.item && params.property) {
          propertySelect.value = params.property;
          await fetchPropertiesForItem(params.item);
          await initStoryMap(true);   
        } else if (params.item) {
          await fetchPropertiesForItem(params.item);
        }
    }

  
    document.getElementById('filterForm').addEventListener('submit', (e) => {
      e.preventDefault();
      initStoryMap(false);
    });

    // Add event listener to item ID input to fetch properties and update URL
    document.getElementById('itemId').addEventListener('input', (e) => {
      const itemId = e.target.value.trim();
      fetchPropertiesForItem(itemId);
      const propertySelect = document.getElementById('propertyId');
      updateURL(itemId, propertySelect.value);
    });

    // Add event listener to property select to update URL
    document.getElementById('propertyId').addEventListener('change', (e) => {
      const itemInput = document.getElementById('itemId');
      updateURL(itemInput.value, e.target.value);
    });

    // Initialize the form and show placeholder
    initializeForm().then(() => {
      const params = getQueryParams();
      if (!params.item || !params.property) {
        renderPlaceholder('Enter an Item ID and select a Property to fetch a timetrail.');
      }
    });
  </script>
</body>
</html>
